<!DOCTYPE html>
<html>
    <head><title>Student Registration Form</title></head>
    <body>
        <h1>Student Registration Form</h1>
        <form>
            <label for="name">Full Name:</label>
            <input 
            type="text" 
            id="name" 
            name="fullName" 
            placeholder="Enter your full name"
            minlength="3"
            maxlength="50"
            required>
        
        <br>
        
            <label for="code">Student Code:</label>
            <input 
            type="text" 
            id="code" 
            name="studentCode"
            pattern="[A-Z a-z 0-9]+" 
            placeholder="Letters and numbers only"
            required>
        
        <br>
        
            <label for="email">Email:</label>
            <input
            type="email"
            id="email"
            name="studentEmail"
            placeholder="example@gmail.com"
            required>
        
        <br>
        
            <label for="phone">Phone:</label>
            <input 
            type="text" 
            id="phone" 
            name="studentPhone"
            pattern="[0-9]+" 
            placeholder="Numbers only"
            required>
        
        <br>
        
            <label for="dob">Date of Birth:</label>
            <input 
            type="date"
            id="dob" 
            name="DoB" 
            required>
        
        <br>
        
            <label for="age">Age:</label>
            <input 
            type="number"
            id="age" 
            name="Age" 
            min="18"
            max="30"
            required>
        
        <br>
        
            <p>Gender:</p>
            <input
            type="radio"
            id="male"
            name="gender"
            value="male">
            <label for="male">Male</label>
            <input
            type="radio"
            id="female"
            name="gender"
            value="female">
            <label for="female">Female</label>
        
        <br>
        
            <label for="major">Major:</label>
            <select
            id="major"
            name="Major"
            required>
            <option value="">-- Select a major --</option>
            <option value="it">Information Technology</option>
            <option value="ai">Artificial Intelligence</option>
            <option value="business">Business Administration</option>
            </select>
        
        <br>
        
            <label for="year">Year:</label>
            <select
            id="year"
            name="Year"
            required>
            <option value="">-- Select a year --</option>
            <option value="1">2023</option>
            <option value="2">2024</option>
            <option value="2">2025</option>
            </select>
        
        <br>
        
            <p>Hobbies:</p>
            <input
            type="checkbox"
            id="sports"
            name="hobby"
            value="sports">
            <label for="sports">Sports</label>
            <br>
            <input
            type="checkbox"
            id="music"
            name="hobby"
            value="music">
            <label for="music">Music</label>
            <br>
            <input
            type="checkbox"
            id="reading"
            name="hobby"
            value="reading">
            <label for="reading">Reading</label>
            <br>
        
        <br>
        
            <p>Programming Languages:</p>
            <input
            type="checkbox"
            id="c++"
            name="proLang"
            value="c++">
            <label for="c++">C++</label>
            <br>
            <input
            type="checkbox"
            id="java"
            name="proLang"
            value="java">
            <label for="java">JavaScript</label>
            <br>
            <input
            type="checkbox"
            id="python"
            name="proLang"
            value="python">
            <label for="python">Python</label>
            <br>
        
        <br>
        
            <label for="photo">Profile Picture:</label>
            <input
            type="file"
            id="photo"
            name="Photo"
            accept="image/*"
            required>
            <br>
        
        <br>
        
            <label for="studentID">Student ID:</label>
            <input
            type="text"
            id="studentID"
            name="studentId"
            value="SV088"
            readonly>
        
        <br>
        
            <label for="country">Country:</label>
            <input
            type="text"
            id="country"
            name="Country"
            value="Vietnam"
            disabled>
        
        <br>
        
            <label for="address">Address:</label>
            <br>
            <textarea
            id="address"
            name="Address"
            rows="5"
            cols="40"
            placeholder="Enter your address"
            required></textarea>
        
        <br>
        
            <label for="intro">Introduction:</label>
            <br>
            <textarea
            id="intro"
            name="Intro"
            rows="5"
            cols="40"
            maxlength="200"
            placeholder="Introduce yourself"
            required></textarea>
        
        <br>
        
            <label for="password">Password:</label>
            <input
            type="password"
            id="password"
            name="Password"
            placeholder="Enter your password"
            required>
            <br>
            <button>Submit</button>
            <br>
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
